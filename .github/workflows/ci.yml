name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  NFPM_VERSION: "2.47.0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath netchecker-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: netchecker-windows.zip

  linux:
    name: Linux deb and rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake libgtk-3-dev clang pkg-config
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Stage bundle
        run: |
          mkdir -p dist
          cp -a build/linux/x64/release/bundle dist/bundle
          cp linux/packaging/nfpm.yaml dist/nfpm.yaml
          cp linux/packaging/netchecker.desktop dist/netchecker.desktop
          cp linux/packaging/netchecker.sh dist/netchecker.sh
          chmod +x dist/netchecker.sh dist/bundle/netchecker
      - name: Install nFPM
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Package deb and rpm
        working-directory: dist
        env:
          VERSION: 0.0.${{ github.run_number }}
        run: |
          nfpm package --config nfpm.yaml --packager deb --target "$GITHUB_WORKSPACE/netchecker.deb"
          nfpm package --config nfpm.yaml --packager rpm --target "$GITHUB_WORKSPACE/netchecker.rpm"
      - name: Zip bundle
        run: |
          (cd build/linux/x64/release/bundle && zip -r "$GITHUB_WORKSPACE/netchecker-linux-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            netchecker.deb
            netchecker.rpm
            netchecker-linux-x64.zip

  nightly:
    name: Nightly release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze, android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          generate_release_notes: true
          files: |
            out/**/*.apk
            out/**/*.zip
            out/**/*.deb
            out/**/*.rpm
