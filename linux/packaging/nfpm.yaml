name: netchecker
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: moreweb <hello@moreweb.ir>
description: Sequential network reachability instrument for VPN engineers.
homepage: https://moreweb.ir
license: MIT
depends:
  - libgtk-3-0
  - libblkid1
  - liblzma5
contents:
  - src: ./bundle/
    dst: /opt/netchecker
  - src: ./netchecker.desktop
    dst: /usr/share/applications/netchecker.desktop
  - src: ./netchecker.sh
    dst: /usr/bin/netchecker
    file_info:
      mode: 0755
overrides:
  rpm:
    depends:
      - gtk3
      - libblkid
      - xz-libs
